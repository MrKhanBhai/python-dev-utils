name: Python tests

on:
  push:
    branches: [main, "feat/**", "improve/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff coverage
      - name: Lint
        run: ruff check .
      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m
      - name: Smoke-test command-line entry point
        run: dev-utils --help
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload verified distribution artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-dev-utils-0.3.0-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
