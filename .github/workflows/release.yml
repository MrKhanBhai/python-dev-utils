name: Publish GitHub release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "0.3.0" ]; then
            echo "Expected release version 0.3.0, found $VERSION"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Create GitHub Release and upload distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --title "python-dev-utils $TAG" \
            --notes "Release 0.3.0: CLI commands, versioned JSON directory manifests, stronger validation, PEP 561 typing metadata, and expanded cross-platform CI. See CHANGELOG.md for details."
